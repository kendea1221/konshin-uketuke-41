<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTA受付スキャナー</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; padding-top: 20px; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; border: none !important; border-radius: 12px; overflow: hidden; }
    .status-container { max-width: 450px; margin: 20px auto; padding: 15px; text-align: center; color: #666; }
  </style>
</head>
<body>

<div class="container">
  <div class="text-center mb-3">
    <h3 class="fw-bold text-secondary">懇親会 受付スキャナー</h3>
    <p class="text-muted small">QRコードをカメラにかざしてください</p>
  </div>

  <div id="reader" class="shadow-sm"></div>

  <div class="status-container">
    <div id="loading" style="display:none;" class="spinner-border spinner-border-sm text-primary" role="status"></div>
    <span id="scan-status">スキャン待機中...</span>
  </div>
</div>

<div class="modal fade" id="resultModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-light">
        <h5 class="modal-title fw-bold" id="modalName">保護者様</h5>
      </div>
      <div class="modal-body">
        <p class="mb-3">現在の状態: <span id="modalCurrentStatus" class="fw-bold"></span></p>

        <div class="form-check form-switch p-3 bg-light rounded border">
          <input class="form-check-input" type="checkbox" id="collectMoneyCheck" style="transform: scale(1.3); margin-left: -1.5em;">
          <label class="form-check-label fw-bold text-primary" for="collectMoneyCheck" style="margin-left: 0.5em;">
            ここで会費を集金する
          </label>
        </div>
      </div>
      <div class="modal-footer flex-column">
        <button type="button" class="btn btn-success w-100 fs-5 fw-bold py-2" id="btnSubmit">受付を確定する</button>
        <button type="button" class="btn btn-sm btn-link text-secondary mt-1" id="btnCancel">キャンセル</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // ▼ GASウェブアプリのURL（/exec で終わるもの）
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbw-mO3BYEinXL527aNjSBXz337CZpxicOWZP0KGCeWN9-pIVcSDNeKXQhPHSTWfSYXH3A/exec';

  let html5QrcodeScanner;
  let isProcessing = false;
  let currentTargetId = null;

  const bsModal = new bootstrap.Modal(document.getElementById('resultModal'));

  // GASのdoPostを呼び出す共通関数
  // Content-Typeをtext/plainにすると、GAS側でCORSエラーになりにくい
  // 合言葉はこの端末にだけ保存（GitHubには載らない）
  function getPasscode() {
    try { return localStorage.getItem('staffPasscode') || ''; } catch (e) { return ''; }
  }
  function setPasscode(v) {
    try { localStorage.setItem('staffPasscode', v); } catch (e) {}
  }

  async function callGas(payload) {
    payload.passcode = getPasscode();
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'GASエラー');
    return json.data;
  }

  // QRコード検出時の処理
  async function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    playBeep(880, 0.1);

    document.getElementById('loading').style.display = 'inline-block';
    document.getElementById('scan-status').innerText = ' データ照合中...';

    try {
      const scannedId = decodedText.trim();
      const userData = await callGas({ action: 'getUserData', id: scannedId });
      document.getElementById('loading').style.display = 'none';

      if (!userData) {
        alert('エラー: 該当するIDが見つかりません。');
        resetScanner();
        return;
      }

      document.getElementById('modalName').innerText = userData.name + ' の保護者様';
      const statusEl = document.getElementById('modalCurrentStatus');
      statusEl.innerText = userData.status;

      if (String(userData.status).includes('済')) {
        statusEl.className = 'text-success fw-bold';
        document.getElementById('collectMoneyCheck').checked = String(userData.status).includes('集金有');
      } else {
        statusEl.className = 'text-danger fw-bold';
        document.getElementById('collectMoneyCheck').checked = true; // デフォルトで集金ON
      }

      currentTargetId = scannedId;
      document.getElementById('scan-status').innerText = 'スキャン一時停止中';
      bsModal.show();
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      alert('通信エラーが発生しました。\n' + err.message);
      resetScanner();
    }
  }

  // 「受付を確定する」
  document.getElementById('btnSubmit').addEventListener('click', async () => {
    const isPaid = document.getElementById('collectMoneyCheck').checked;
    document.getElementById('scan-status').innerText = ' スプレッドシートを更新中...';
    bsModal.hide();

    try {
      await callGas({ action: 'updateStatus', id: currentTargetId, isPaid: isPaid });
      playBeep(1200, 0.2);
      resetScanner();
    } catch (err) {
      alert('更新に失敗しました。もう一度スキャンしてください。\n' + err.message);
      resetScanner();
    }
  });

  // 「キャンセル」
  document.getElementById('btnCancel').addEventListener('click', () => {
    bsModal.hide();
    resetScanner();
  });

  // スキャナーを待機状態に戻す（同じQRの連続読み取りを防ぐため少し待つ）
  function resetScanner() {
    document.getElementById('scan-status').innerText = 'QRコードをかざしてください';
    currentTargetId = null;
    setTimeout(() => { isProcessing = false; }, 1500);
  }

  function playBeep(freq, duration) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  // 合言葉の確認（未入力・間違いなら入力を求める）
  async function ensurePasscode() {
    while (true) {
      if (!getPasscode()) {
        const input = prompt('受付担当の合言葉を入力してください');
        if (input === null) continue;
        setPasscode(input.trim());
      }
      try {
        await callGas({ action: 'checkPasscode' });
        return;
      } catch (err) {
        alert('合言葉が違うか、通信できません。\n' + err.message);
        setPasscode('');
      }
    }
  }

  // 合言葉確認後にカメラ起動
  window.addEventListener('DOMContentLoaded', async () => {
    await ensurePasscode();
    html5QrcodeScanner = new Html5QrcodeScanner('reader', {
      fps: 10,
      qrbox: { width: 250, height: 250 },
      rememberLastUsedCamera: true
    });
    html5QrcodeScanner.render(onScanSuccess);
  });
</script>

</body>
</html>
