<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PTA受付スキャナー</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #f4f6f9; padding-top: 20px; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; border: none !important; border-radius: 12px; overflow: hidden; }
    .status-container { max-width: 450px; margin: 20px auto; padding: 15px; text-align: center; color: #666; }
  </style>
</head>
<body>

<div class="container">
  <div class="text-center mb-3">
    <h3 class="fw-bold text-secondary">懇親会 受付スキャナー</h3>
    <p class="text-muted small">QRコードをカメラにかざしてください (GitHub Pages版)</p>
  </div>
  
  <div id="reader" class="shadow-sm"></div>
  
  <div class="status-container">
    <div id="loading" style="display:none;" class="spinner-border spinner-border-sm text-primary" role="status"></div>
    <span id="scan-status">スキャン待機中...</span>
  </div>
</div>

<div class="modal fade" id="resultModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-light">
        <h5 class="modal-title fw-bold" id="modalName">保護者様</h5>
      </div>
      <div class="modal-body">
        <p class="mb-3">現在の状態: <span id="modalCurrentStatus" class="fw-bold"></span></p>
        <div class="form-check form-switch p-3 bg-light rounded border">
          <input class="form-check-input" type="checkbox" id="collectMoneyCheck" style="transform: scale(1.3); margin-left: -1.5em;">
          <label class="form-check-label fw-bold text-primary" for="collectMoneyCheck" style="margin-left: 0.5em;">
            ここで会費を集金する
          </label>
        </div>
      </div>
      <div class="modal-footer flex-column">
        <button type="button" class="btn btn-success w-100 fs-5 fw-bold py-2" id="btnSubmit">受付を確定する</button>
        <button type="button" class="btn btn-sm btn-link text-secondary mt-1" id="btnCancel">キャンセル</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // ★ここに新しいGASのウェブアプリURLを貼り付けてください
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzb7FM6P-syToi_V7zdM-EJUcy6tFXGDPbn7yt6dYbNPG18sOhn4cFINtVz3PbSbKqx0A/exec';

  let html5QrcodeScanner;
  let isProcessing = false;
  let currentTargetRow = null;
  const bsModal = new bootstrap.Modal(document.getElementById('resultModal'));

  function onScanSuccess(decodedText, decodedResult) {
    if (isProcessing) return; 
    isProcessing = true;
    
    playBeep(880, 0.1);
    document.getElementById('loading').style.display = 'inline-block';
    document.getElementById('scan-status').innerText = ' データ照合中...';

    // GitHub PagesからGAS APIへフェッチ
    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getUserData", id: decodedText })
    })
    .then(res => res.json())
    .then(response => {
      document.getElementById('loading').style.display = 'none';
      if (response.success && response.data) {
        const userData = response.data;
        document.getElementById('modalName').innerText = userData.name + " の保護者様";
        document.getElementById('modalCurrentStatus').innerText = userData.status;
        
        if (userData.status.includes("済")) {
          document.getElementById('modalCurrentStatus').className = "text-success fw-bold";
          document.getElementById('collectMoneyCheck').checked = userData.status.includes("集金有");
        } else {
          document.getElementById('modalCurrentStatus').className = "text-danger fw-bold";
          document.getElementById('collectMoneyCheck').checked = true;
        }
        
        currentTargetRow = userData.rowIndex;
        document.getElementById('scan-status').innerText = 'スキャン一時停止中';
        bsModal.show();
      } else {
        alert("エラー: 該当するIDが見つかりません。");
        resetScanner();
      }
    })
    .catch(err => {
      document.getElementById('loading').style.display = 'none';
      alert("通信エラーが発生しました。");
      resetScanner();
    });
  }

  document.getElementById('btnSubmit').addEventListener('click', () => {
    const isPaid = document.getElementById('collectMoneyCheck').checked;
    document.getElementById('scan-status').innerText = ' 更新中...';
    bsModal.hide();
    
    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "updateStatus", rowIndex: currentTargetRow, isPaid: isPaid })
    })
    .then(res => res.json())
    .then(response => {
      if(response.success) {
        playBeep(1200, 0.2);
      } else {
        alert("更新に失敗しました");
      }
      resetScanner();
    })
    .catch(err => {
      alert("通信エラーが発生しました。");
      resetScanner();
    });
  });

  document.getElementById('btnCancel').addEventListener('click', () => {
    bsModal.hide();
    resetScanner();
  });

  function resetScanner() {
    document.getElementById('scan-status').innerText = 'QRコードをかざしてください';
    currentTargetRow = null;
    isProcessing = false;
  }

  function playBeep(freq, duration) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  window.addEventListener('DOMContentLoaded', () => {
    html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
      fps: 10, 
      qrbox: { width: 250, height: 250 },
      rememberLastUsedCamera: true
    });
    html5QrcodeScanner.render(onScanSuccess);
  });
</script>

</body>
</html>
